name: FORGE X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: forge-x-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path programs/forge-x-fair-launch/Cargo.toml
      - run: npm install --no-audit --no-fund
      - name: Commit resolved dependency lock
        run: |
          git config user.name "FORGE X CI"
          git config user.email "ci@forge-x.local"
          git add package-lock.json
          git commit -m "chore: add npm dependency lock"
          git push origin HEAD:main
      - run: npm run lint
      - run: npm run build
