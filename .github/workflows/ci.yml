name: FORGE X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: forge-x-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path programs/forge-x-fair-launch/Cargo.toml
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
